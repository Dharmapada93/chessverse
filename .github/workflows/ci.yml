name: ChessVerse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Root & Server Dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Lint Verification
        run: npm run lint

      - name: Server TypeScript Typecheck
        run: npm run build --prefix server

      - name: Run Unit Tests
        run: npx tsx --test tests/unit/**/*.test.ts

      - name: Run Integration Tests
        run: npx tsx --test tests/integration/**/*.test.ts

      - name: Client Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
