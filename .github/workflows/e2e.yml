name: ChessVerse E2E Real-Time Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # Nightly 4 AM UTC check

jobs:
  e2e:
    name: Real-Time Chess Socket & E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Run E2E Test Suite
        run: npx tsx --test tests/e2e/**/*.test.ts
